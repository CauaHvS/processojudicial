spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/processo_judicial
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:C@u@S@2026@}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.attus: DEBUG
    org.springframework.web: INFO